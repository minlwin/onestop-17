spring.application.name=balance-api

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/balancedb}
spring.datasource.username=${POSTGRES_USER:balancedb}
spring.datasource.password=${POSTGRES_PASSWORD:balancepwd}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=management@balance.com

app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:P@ssw0rd}

app.token.issuer=com.jdc.onestop17
app.token.access-life=30
app.token.refresh-life=360

app.otp.max-life=60

app.activation.link=http://localhost:3000/activation
app.storage.path=storage
